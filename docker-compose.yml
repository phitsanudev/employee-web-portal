services:
  postgres:
    image: postgres:16-alpine
    container_name: employee_portal_postgres
    environment:
      POSTGRES_USER: employee
      POSTGRES_PASSWORD: employee
      POSTGRES_DB: employee_portal
    ports:
      - "5432:5432"
    volumes:
      - employee_portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee -d employee_portal"]
      interval: 5s
      timeout: 5s
      retries: 8

volumes:
  employee_portal_pgdata:
