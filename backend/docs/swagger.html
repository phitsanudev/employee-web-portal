<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee Web Portal API - Swagger UI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #f7f8fa;
      }

      .top {
        padding: 18px 28px;
        color: #fff;
        background: #12705d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .top h1 {
        margin: 0;
        font-size: 22px;
      }

      .top p {
        margin: 4px 0 0;
        opacity: 0.86;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>Employee Web Portal API</h1>
      <p>Swagger UI loads the OpenAPI contract from /openapi.json</p>
    </header>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        persistAuthorization: true,
        layout: "BaseLayout"
      });
    </script>
  </body>
</html>
